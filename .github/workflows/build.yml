name: Build

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: "Signed Release build (not published)"
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"
    # Not evaluated for tag pushes, so every v* tag builds.
    paths-ignore:
      - "**.md"
      - ".github/release-notes/**"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the app
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # The release certificate ("Stop Please", self-signed, valid to 18 October 2036).
      # macOS keeps users' Accessibility grant across updates only while every release
      # is signed with it, so Release builds must match this SHA-1.
      SIGNING_CERTIFICATE_SHA1: 87BC56A6F50C8A4F59B3EFB6F69CFD47286EF583

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Determine version and configuration
        id: version
        env:
          SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if ! printf '%s\n' "$GITHUB_REF_NAME" \
              | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
            then
              echo "::error::Unsupported release tag '$GITHUB_REF_NAME'. Release tags must use vMAJOR.MINOR.PATCH with three numeric components."
              exit 1
            fi

            # Checked here so that a missing file fails before the macOS build.
            NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
            if [ ! -f "$NOTES" ]; then
              echo "::error::Release notes $NOTES not found."
              exit 1
            fi

            VERSION="${GITHUB_REF_NAME#v}"
            CONFIGURATION=Release
          elif [ "$SIGNED_RELEASE" = "true" ]; then
            # A manual run that checks a signed Release build without publishing it.
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            CONFIGURATION=Release
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
            CONFIGURATION=Debug
          fi

          # Release builds are signed with the release certificate, and Xcode then adds
          # the hardened runtime. Debug builds stay ad-hoc (Signing.xcconfig's default)
          # and without the runtime: library validation would refuse their
          # StopPlease.debug.dylib, which has no team ID.
          if [ "$CONFIGURATION" = "Release" ]; then
            CODE_SIGN_IDENTITY="Stop Please"
          else
            CODE_SIGN_IDENTITY=-
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CONFIGURATION=$CONFIGURATION" >> "$GITHUB_ENV"
          echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "APP=.build/DerivedData/Build/Products/$CONFIGURATION/StopPlease.app" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: |
          curl -fsSL \
            -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"

          echo \
            "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -

          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      # Into a temporary keychain that the last step deletes.
      - name: Import the signing certificate
        if: env.CONFIGURATION == 'Release'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::Release builds need the secrets MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"

          # Lets codesign use the key without a prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          # A self-signed certificate is not trusted, so it is listed without -v.
          if ! security find-identity -p codesigning "$KEYCHAIN" \
            | grep -q "$SIGNING_CERTIFICATE_SHA1"
          then
            echo "::error::The imported certificate is not the release certificate $SIGNING_CERTIFICATE_SHA1."
            exit 1
          fi

      - name: Build
        run: |
          xcodebuild \
            -project StopPlease.xcodeproj \
            -scheme StopPlease \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            -derivedDataPath .build/DerivedData \
            -quiet \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            build

      - name: Check the app
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP"

          test -f "$APP/Contents/Frameworks/libNowPlayingPerlHelper.dylib"
          test -f "$APP/Contents/Resources/perl_helper.pl"

          BUILT_VERSION="$(/usr/libexec/PlistBuddy \
            -c "Print CFBundleShortVersionString" \
            "$APP/Contents/Info.plist")"

          if [ "$BUILT_VERSION" != "$VERSION" ]; then
            echo "::error::Built version $BUILT_VERSION does not match $VERSION."
            exit 1
          fi

          if [ "$CONFIGURATION" = "Release" ]; then
            LEAF="certificate leaf = H\"$(printf '%s' "$SIGNING_CERTIFICATE_SHA1" | tr 'A-F' 'a-f')\""
            APP_REQUIREMENT="designated => identifier \"com.andrecheng.StopPlease\" and $LEAF"

            if [ "$(codesign -d -r- "$APP" 2>&1 | grep '^designated => ')" != "$APP_REQUIREMENT" ]; then
              echo "::error::$APP does not have the designated requirement: $APP_REQUIREMENT"
              exit 1
            fi

            for CODE in "$APP" "$APP/Contents/Frameworks/libNowPlayingPerlHelper.dylib"; do
              if ! codesign -dv "$CODE" 2>&1 | grep -q 'flags=.*runtime'; then
                echo "::error::$CODE is not signed with the hardened runtime."
                exit 1
              fi
              if ! codesign -d -r- "$CODE" 2>&1 | grep -qF "$LEAF"; then
                echo "::error::$CODE is not signed with the release certificate."
                exit 1
              fi
            done
          fi

      - name: Package zip and DMG
        run: |
          mkdir -p dist "$RUNNER_TEMP/dmg"

          ditto -c -k --keepParent "$APP" "dist/StopPlease-$VERSION.zip"

          # The DMG window shows the app next to an Applications link to drag it onto.
          ditto "$APP" "$RUNNER_TEMP/dmg/StopPlease.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"

          # hdiutil on hosted runners sometimes fails with "Resource busy"; retry.
          for attempt in 1 2 3; do
            hdiutil create \
              -volname "Stop Please!" \
              -srcdir "$RUNNER_TEMP/dmg" \
              -format UDZO \
              -ov \
              "dist/StopPlease-$VERSION.dmg" && break
            sleep 5
          done

          test -f "dist/StopPlease-$VERSION.dmg"

      - name: Check packages
        run: |
          ditto -x -k "dist/StopPlease-$VERSION.zip" "$RUNNER_TEMP/unzipped"
          codesign --verify --deep --strict "$RUNNER_TEMP/unzipped/StopPlease.app"

          hdiutil verify "dist/StopPlease-$VERSION.dmg"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: StopPlease
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Delete the signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN"

  helper-smoke:
    name: Helper smoke test (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: StopPlease
          path: dist

      - name: Unpack the app
        run: |
          ditto -x -k \
            "dist/StopPlease-${{ needs.build.outputs.version }}.zip" \
            "$RUNNER_TEMP/app"

      - name: Start the helper and list sources
        run: python3 -I tests/helper_smoke.py "$RUNNER_TEMP/app/StopPlease.app"

  release:
    name: Publish GitHub Release
    needs: [build, helper-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: StopPlease
          path: dist

      - name: Create GitHub Release
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            "dist/StopPlease-$VERSION.zip" \
            "dist/StopPlease-$VERSION.dmg" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Stop Please! $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
