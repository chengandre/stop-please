# XcodeGen spec. Generate the Xcode project with `xcodegen generate`.
name: StopPlease
options:
  bundleIdPrefix: com.andrecheng
  deploymentTarget:
    macOS: "15.0"
configFiles:
  # Signing identity and team; Developer ID comes with distribution.
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    ARCHS: arm64
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
targets:
  StopPlease:
    type: application
    platform: macOS
    sources:
      - StopPlease
      - path: NowPlayingPerlHelper/perl_helper.pl
        buildPhase: resources
    dependencies:
      # Copied to Contents/Frameworks but not linked: only Perl loads it,
      # by absolute path.
      - target: NowPlayingPerlHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        # Finder shows "Stop Please!" from en.lproj/InfoPlist.strings, but only
        # while this matches the file name, StopPlease.app.
        INFOPLIST_KEY_CFBundleDisplayName: StopPlease
        # Merged with the generated keys; holds LSHasLocalizedDisplayName.
        INFOPLIST_FILE: StopPlease/Info.plist
        # The app must launch /usr/bin/perl.
        ENABLE_APP_SANDBOX: NO
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  NowPlayingPerlHelper:
    type: library.dynamic
    platform: macOS
    sources:
      - NowPlayingPerlHelper/perl_helper.m
    dependencies:
      - sdk: AppKit.framework
    settings:
      base:
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_CFLAGS: [-Wall, -Wextra]
